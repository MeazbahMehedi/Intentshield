name: PromptGuard Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run test suite
        run: python -m pytest -q

      - name: Run main evaluation
        run: python -m promptguard.evaluation.evaluate

      - name: Run robustness evaluation
        run: python -m promptguard.evaluation.evaluate_robustness

      - name: Run holdout evaluation
        run: python -m promptguard.evaluation.evaluate_holdout