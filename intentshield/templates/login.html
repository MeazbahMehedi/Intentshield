{% extends 'base.html' %}{% block content %}<section class="panel ops-card"><div class="ops-heading"><h1>Sign in to IntentShield</h1><p>Use an account created by the administrator with manage.py. Local mode requires no login unless PG_AUTH_REQUIRED=1.</p></div>{% if error %}<div class="ops-status error">{{ error }}</div>{% endif %}<form method="post" class="ops-form"><label>Username<input name="username" required autocomplete="username" maxlength="80"></label><label>Password<input type="password" name="password" required autocomplete="current-password" maxlength="500"></label><div><button class="button button-primary">Sign in</button></div></form></section>{% endblock %}
